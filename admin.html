<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>الأدمن | تيتانيوم للياقة</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <script src="js/i18n.js"></script>
  <script src="js/i18n/admin.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="admin">
  <div id="site-header"></div>

  <!-- صفحة خاصة بحساب النادي (المدربات). غير موجودة في القائمة.
       الحماية الحقيقية في قاعدة البيانات: كل الدوال تتأكد من is_admin(). -->
  <main class="adm">
    <div class="a-top">
      <div>
        <h1 data-i18n="a.title">لوحة الأدمن</h1>
        <p data-i18n="a.text">إدارة تحدي تيتانيوم الرياضي.</p>
      </div>
      <button type="button" class="btn-secondary a-logout" id="a-logout" data-i18n="nav.logout" hidden>تسجيل الخروج</button>
    </div>

    <p class="a-status" id="a-status" aria-live="polite" data-i18n="a.loading">جارٍ التحميل…</p>

    <!-- الدخول (إيميل + كلمة مرور حساب النادي) -->
    <form class="a-card a-login" id="a-login" novalidate hidden>
      <h2 data-i18n="a.loginTitle">دخول الأدمن</h2>
      <label for="a-email" data-i18n="a.email">الإيميل</label>
      <input id="a-email" type="email" autocomplete="username" dir="ltr" required>
      <label for="a-password" data-i18n="a.password">كلمة المرور</label>
      <input id="a-password" type="password" autocomplete="current-password" dir="ltr" required>
      <p class="a-msg" id="a-login-msg" role="alert" hidden></p>
      <button type="submit" class="btn-primary" data-i18n="a.loginBtn">دخول</button>
    </form>

    <!-- حساب مسجّل لكنه مو أدمن -->
    <section class="a-card a-center" id="a-notadmin" hidden>
      <h2 data-i18n="a.notAdminTitle">هذا الحساب ليس حساب أدمن</h2>
      <p data-i18n="a.notAdminText">سجّلي خروج وادخلي بحساب النادي.</p>
    </section>

    <!-- لوحة الأدمن -->
    <div id="a-app" hidden>
      <div class="a-tabs" role="tablist" id="a-tabs">
        <button type="button" role="tab" id="tab-classes" aria-controls="panel-classes" aria-selected="true">
          <span data-i18n="a.tabClasses">الكلاسات</span>
          <span class="a-badge" id="a-badge" hidden></span>
        </button>
        <button type="button" role="tab" id="tab-board" aria-controls="panel-board" aria-selected="false" tabindex="-1">
          <span data-i18n="a.tabBoard">الترتيب</span>
        </button>
        <button type="button" role="tab" id="tab-logs" aria-controls="panel-logs" aria-selected="false" tabindex="-1">
          <span data-i18n="a.tabLogs">السجل</span>
        </button>
        <button type="button" role="tab" id="tab-members" aria-controls="panel-members" aria-selected="false" tabindex="-1">
          <span data-i18n="a.tabMembers">العضوات</span>
        </button>
      </div>

      <section role="tabpanel" id="panel-classes" aria-labelledby="tab-classes" class="a-panel"></section>
      <section role="tabpanel" id="panel-board" aria-labelledby="tab-board" class="a-panel" hidden></section>
      <section role="tabpanel" id="panel-logs" aria-labelledby="tab-logs" class="a-panel" hidden></section>
      <section role="tabpanel" id="panel-members" aria-labelledby="tab-members" class="a-panel" hidden></section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/vendor/supabase.js" defer></script>
  <script src="js/supabaseClient.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/admin.js" defer></script>
</body>
</html>
